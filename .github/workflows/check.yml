name: Check NixOS configuration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate the system and validate desktop configurations
        run: nix flake check --accept-flake-config --no-update-lock-file --print-build-logs
      - name: Evaluate the complete system derivation
        run: nix eval --accept-flake-config --no-update-lock-file --raw .#nixosConfigurations.acer-a715-42g.config.system.build.toplevel.drvPath
