# Dark pixel street style adapted from AngelOS's Noctalia setup.
# @WALLPAPER@ is replaced with the Nix store path during evaluation.

[shell]
setup_wizard_enabled = false
font_family = "Inter SemiBold"
corner_radius_scale = 1.15

    [shell.shadow]
    direction = "down"
    alpha = 0.52

    [shell.panel]
    transparency_mode = "glass"
    background_blur = true

[accessibility]
ui_scale = 1.1

[backdrop]
enabled = true
blur_intensity = 0.85
tint_intensity = 0.45

[wallpaper.default]
path = "@WALLPAPER@"

[wallpaper]
directory = "@WALLPAPER_DIRECTORY@"

[theme]
mode = "dark"
source = "wallpaper"
builtin = "Gruvbox"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    enable_builtin_templates = true
    builtin_ids = [ "kitty" ]

[bar.default]
start = [ "launcher", "wallpaper", "workspaces", "active_window" ]
center = [ "media", "clock", "date" ]
end = [ "tray", "notifications", "network", "bluetooth", "keyboard_layout", "battery", "volume", "control-center", "session" ]
position = "top"
margin_edge = 5
margin_ends = 19
radius = 10
capsule = true
font_family = "JetBrainsMono Nerd Font"
font_scale = 1.05
font_weight = 700
scale = 1.1

[widget.active_window]
type = "active_window"
min_length = 60
max_length = 180

[widget.media]
type = "media"
min_length = 60
max_length = 160
hide_when_no_media = true

[widget.clock]
type = "clock"
format = "{:%H:%M}"
font_scale = 1.12

[widget.date]
type = "clock"
format = "{:%a %d %b}"
font_scale = 0.9

[widget.battery]
type = "battery"
display_mode = "glyph"
show_label = true

[notification]
background_opacity = 0.78

[osd]
background_opacity = 0.78

[nightlight]
enabled = true
temperature_day = 6600
temperature_night = 3900
